name: Android

on:
  push:
    branches: [main]
    tags: ['android-v*']
    paths: ['android/**', 'src/auth/**', 'src/routes/api/mobile/**', 'tests/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'src/auth/**', 'src/routes/api/mobile/**', 'tests/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Test mobile authorization
        run: node --test tests/mobileTokens.test.ts
      - name: Build, test, and lint native app
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Derive monotonically increasing Android version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          match = re.fullmatch(r"android-v(\d+)\.(\d+)\.(\d+)", os.environ["TAG"])
          if not match:
              raise SystemExit("Use an android-vMAJOR.MINOR.PATCH tag")
          major, minor, patch = map(int, match.groups())
          code = major * 1_000_000 + minor * 1_000 + patch
          if minor > 999 or patch > 999 or not 0 < code <= 2_100_000_000:
              raise SystemExit("Version is outside Android's versionCode range")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"ANDROID_VERSION_NAME={major}.{minor}.{patch}\nANDROID_VERSION_CODE={code}\n")
          PY
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          key = os.environ.get("KEYSTORE_BASE64")
          if not key:
              raise SystemExit("Configure ANDROID_KEYSTORE_BASE64 before publishing")
          path = os.path.join(os.environ["RUNNER_TEMP"], "period-release.jks")
          with open(path, "wb") as output:
              output.write(base64.b64decode(key, validate=True))
          os.chmod(path, 0o600)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"ANDROID_KEYSTORE_PATH={path}\n")
          PY
      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Verify and package APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          mkdir release
          cp android/app/build/outputs/apk/release/app-release.apk "release/period-tracker-${ANDROID_VERSION_NAME}.apk"
          cd release
          sha256sum *.apk > SHA256SUMS
      - name: Publish Obtainium-compatible GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/*.apk release/SHA256SUMS \
            --verify-tag --title "Android ${ANDROID_VERSION_NAME}" \
            --notes-file android/RELEASE_NOTES.md
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/period-release.jks"
